# Paths are relative to this file.
seed: 42

data:
  raw_dir: ../data/raw
  fred_dir: ../data/raw/fred
  interim_dir: ../data/interim
  processed_dir: ../data/processed

# Split by origination year. Train and validation only use months before the cutoff.
split:
  train_vintages: [2015, 2016]
  validation_vintages: [2017]
  test_vintages: [2019]
  cutoff_period: 201901  # YYYYMM, first month of the test period

# Economic data from FRED (fred.stlouisfed.org). The API key is read from
# FRED_API_KEY in the environment or in .env at the project root.
macro:
  rate_series_long: MORTGAGE30US  # weekly 30-year fixed mortgage rate
  rate_series_short: MORTGAGE15US  # weekly 15-year fixed mortgage rate
  short_term_max_months: 180  # loans this long or shorter use the 15-year rate
  origination_lag_months: 2  # origination month = first payment month minus this

# Event definitions. See docs/decisions.md and notebooks/01_data_audit.ipynb (rule B).
events:
  default:
    min_delinquency_code: 3  # 3 = 90 to 119 days late
    reo_code: RA  # lender took the property
    credit_loss_zero_balance_codes: ["02", "03", "09"]
    ignore_relief_months: true  # forbearance (F) or disaster relief (Y)
  prepay_zero_balance_codes: ["01"]
  censor_zero_balance_codes: ["15", "16", "96"]

filters:
  drop_harp: true

# Sample whole loans, not rows.
sample:
  build_rate: 0.05
  final_rate: 0.10

models:
  logistic_horizon_months: 12  # default by this loan age, in months
  numeric_features: [credit_score, ltv, dti, orig_rate]
  categorical_features: [purpose, occupancy]
  logistic:  # keyword arguments for sklearn LogisticRegression
    C: 1.0  # inverse penalty strength; larger means less shrinking
    solver: newton-cholesky  # lbfgs stops too early with rare defaults
    max_iter: 1000
  cox:  # keyword arguments for sksurv CoxPHSurvivalAnalysis
    alpha: 0.0  # ridge penalty; 0 means none
    ties: breslow  # how to handle loans defaulting in the same month

loss:
  horizon_months: 36  # expected loss over the first 36 months of a loan

evaluation:
  n_bins: 10  # risk bands for calibration tables
  ph_split_age: 18  # loan age that splits the proportional hazards check
  n_bootstrap: 1000  # resamples for bootstrap intervals
