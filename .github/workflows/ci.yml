# Runs the code checks and tests on every pull request and on main.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Lint, type check and test
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Uses the version in .python-version.
      - name: Install Python
        run: uv python install

      # Exact versions from uv.lock, including dev tools.
      - name: Install packages
        run: uv sync --locked --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Check formatting (ruff)
        run: uv run ruff format --check .

      - name: Check types (mypy)
        run: uv run mypy

      # Tests use small made-up loans, so no real data is needed.
      - name: Run tests (pytest)
        run: uv run pytest
